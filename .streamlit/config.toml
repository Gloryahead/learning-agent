# Streamlit configuration file
# This controls how the app looks and behaves

[server]
# Don't open the browser automatically (we'll open it ourselves)
headless = false

[theme]
# Color scheme — dark purple/blue to match the "brain learning" feel
primaryColor = "#a855f7"          # Purple — buttons, sliders, active widgets
backgroundColor = "#0f0f1a"       # Very dark navy — main background
secondaryBackgroundColor = "#1a1a2e"  # Slightly lighter — sidebars, cards
textColor = "#e2e8f0"             # Light grey — all text
font = "sans serif"
